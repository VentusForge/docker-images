version: 2

registries:
  dhi-io:
    type: docker-registry
    url: https://dhi.io
    username: ${{ secrets.GLOBAL_DOCKER_HUB_USER }}
    password: ${{ secrets.GLOBAL_DOCKER_HUB_TOKEN }}

updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  - package-ecosystem: "docker"
    directories:
      - "/*/*"
      - "/*/*/*"
    registries:
      - dhi-io
    schedule:
      interval: "weekly"
