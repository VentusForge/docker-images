name: Build Docker Image

on:
  workflow_call:
    inputs:
      force-build-image:
        type: boolean
        required: false
        default: false
      docker-registry:
        type: string
        required: true
      docker-image-owner:
        type: string
        required: true
      docker-image-name:
        type: string
        required: true
      docker-image-tag:
        type: string
        required: true
      build-platforms:
        type: string
        required: false
        default: "linux/amd64,linux/arm64"
      build-context:
        type: string
        required: true
      vulnerability-scan-run:
        type: boolean
        default: true
      vulnerability-scan-threshold:
        type: string
        default: CRITICAL
      use-dhi-io:
        type: boolean
        default: false
      additional-image-names:
        type: string
        default: ""
        description: "Additional image names to be used for pushing"
      qemu-platforms:
        type: string
        required: false
        default: 'false'
        description: "QEMU platforms"
    secrets:
      REGISTRY_USERNAME:
        required: true
        description: "Docker registry username"
      REGISTRY_PASSWORD:
        required: true
        description: "Docker registry password"
      DOCKER_HUB_USER:
        required: false
        description: "Docker Hub username"
      DOCKER_HUB_TOKEN:
        required: false
        description: "Docker Hub token"
      BUILD_SECRETS:
        required: false
        description: "Build secrets to be used during build"
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Log into ${{ inputs.docker-registry }}
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550
        with:
          registry: ${{ inputs.docker-registry }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Log into registry dhi.io
        if: inputs.use-dhi-io == true
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550
        with:
          registry: dhi.io
          username: ${{ secrets.DOCKER_HUB_USER }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}


      - name: Set up QEMU
        if: inputs.qemu-platforms != '' && inputs.qemu-platforms != 'false'
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1
        with:
          platforms: ${{ inputs.qemu-platforms }}

      - name: Setup Docker buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069

      - name: Extract base image reference
        id: base
        working-directory: ${{ inputs.build-context }}
        run: |
          BASE_IMAGE=$(grep -E '^FROM[[:space:]]' Dockerfile | awk '{print $2}')
          echo "ref=${BASE_IMAGE}" >> "$GITHUB_OUTPUT"
          echo "tag=${BASE_IMAGE##*:}" >> "$GITHUB_OUTPUT"

      - name: Resolve base image digest tag
        id: base_digest
        run: |
          DIGEST=$(docker buildx imagetools inspect "${{ steps.base.outputs.ref }}" --format '{{.Manifest.Digest}}')
          DIGEST_TAG="${DIGEST/:/-}"
          echo "tag=${DIGEST_TAG}" >> "$GITHUB_OUTPUT"
          if docker buildx imagetools inspect "${{ inputs.docker-registry }}/${{ inputs.docker-image-owner }}/${{ inputs.docker-image-name }}:${DIGEST_TAG}" > /dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Decide whether to build
        id: decide
        run: |
          # Build when the base image changed, when forced, or when the image's
          # files changed (push to main). Without the push case a Dockerfile change
          # on an unchanged base image would never produce a new timestamp tag.
          if [[ "${{ steps.base_digest.outputs.exists }}" != "true" \
             || "${{ inputs.force-build-image }}" == "true" \
             || "${{ github.event_name }}" == "push" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Base image digest unchanged, skipping build."
          fi

      - name: Generate timestamp version tag
        id: timestamp
        if: steps.decide.outputs.run == 'true'
        env:
          INPUT_TAG: ${{ inputs.docker-image-tag }}
        run: |
          # Tag format: <major>.<minor>.<patch>.<YYYYMMDDHHMM>[-<variant>][-dev]
          #
          # Dependabot only compares tags with the same suffix and the same tag format,
          # and sorts them by the numeric version in front of the suffix. Therefore:
          # - the build timestamp is part of the numeric version, never of the suffix.
          #   It must be separated by a dot: after a dash Dependabot reads the long
          #   number as a commit SHA and treats the tag as a different format
          # - the version is always padded to three parts, so all variants of an image
          #   (normal and -dev) share one format and one precision
          # - the suffix (e.g. -alpine, -fpm-alpine, -dev) stays identical across builds.
          #   Dependabot treats "-dev" tags as pre-releases: images pinned to a normal
          #   tag never get a -dev update and vice versa.
          BUILD_STAMP="$(date -u +%Y%m%d%H%M)"
          REST="${INPUT_TAG#v}"
          if [[ ! "$REST" =~ ^([0-9]+(\.[0-9]+)*)(-[a-z][a-z0-9.-]*)?$ ]]; then
            echo "::error::Tag '${INPUT_TAG}' must look like <version>[-<suffix>], e.g. 8, 3.24, 1-alpine, 8.4-fpm-alpine or 3.9-debian-dev"
            exit 1
          fi
  
          VERSION="${BASH_REMATCH[1]}"
          SUFFIX="${BASH_REMATCH[3]}"
          IFS='.' read -r -a PARTS <<< "$VERSION"
          while [[ ${#PARTS[@]} -lt 3 ]]; do PARTS+=(0); done
          VERSION="$(IFS='.'; echo "${PARTS[*]}")"

          TAG="${VERSION}.${BUILD_STAMP}${SUFFIX}"
          echo "Timestamp tag: ${TAG}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Extract Docker metadata
        id: meta
        if: steps.decide.outputs.run == 'true'
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302
        with:
          images: |
            ${{ inputs.docker-registry }}/${{ inputs.docker-image-owner }}/${{ inputs.docker-image-name }}
            ${{ inputs.additional-image-names }}
          tags: |
            type=raw,value=${{ inputs.docker-image-tag }}
            type=raw,value=${{ steps.base.outputs.tag }}
            type=raw,value=${{ steps.timestamp.outputs.tag }}
            type=raw,value=${{ steps.base_digest.outputs.tag }}

      - name: Build and Push Docker Image ${{ inputs.docker-image-tag }}
        if: steps.decide.outputs.run == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: ${{ inputs.build-context }}
          push: true
          platforms: ${{ inputs.build-platforms }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          sbom: true
          provenance: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          secrets: ${{ secrets.BUILD_SECRETS }}

      - name: Scan for vulnerabilities
        if: ${{ inputs.vulnerability-scan-run && steps.decide.outputs.run == 'true' }}
        uses: crazy-max/ghaction-container-scan@v4
        with:
          image: ${{ fromJSON(steps.meta.outputs.json).tags[0] }}
          dockerfile: ${{ inputs.build-context }}/Dockerfile
          annotations: true
          severity_threshold: ${{ inputs.vulnerability-scan-threshold }}
        env:
          TRIVY_TIMEOUT: 10m
          TRIVY_SCANNERS: 'vuln'
