name: php

on:
  workflow_dispatch:
    inputs:
      force:
        description: 'Force Build (skip SHA check)'
        type: boolean
        default: false
  schedule:
    - cron: "0 2 * * 0"
  push:
    branches:
      - main
    paths:
      - 'php/**'
      - '.github/workflows/php.yml'

jobs:
  build:
    uses: ./.github/workflows/_build-image.yml
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        version:
          - "8.3-fpm-alpine"
          - "8.4-fpm-alpine"
          - "8.5-fpm-alpine"
    with:
      force-build-image: ${{ inputs.force == true }}
      docker-registry: ghcr.io
      docker-image-owner: erkenes
      docker-image-name: php
      docker-image-tag: ${{ matrix.version }}
      build-context: ./php/${{ matrix.version }}
      vulnerability-scan-run: ${{ vars.PHP__VUL_SCAN == 'true' }}
      use-dhi-io: false
      qemu-platforms: 'linux/arm64'
    secrets:
      REGISTRY_USERNAME: ${{ github.actor }}
      REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
      DOCKER_HUB_USER: ${{ secrets.GLOBAL_DOCKER_HUB_USER }}
      DOCKER_HUB_TOKEN: ${{ secrets.GLOBAL_DOCKER_HUB_TOKEN }}
